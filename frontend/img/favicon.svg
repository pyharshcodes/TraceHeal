<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favNexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background rounded -->
  <rect width="64" height="64" rx="14" fill="#070B12" />
  <rect width="64" height="64" rx="14" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />

  <!-- Tri-Node Topology Links -->
  <path d="M 32 12 L 50 48 L 14 48 Z" stroke="rgba(6, 182, 212, 0.5)" stroke-width="2" stroke-dasharray="3 2" fill="none" />
  <path d="M 32 12 L 32 48" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="none" />

  <!-- Outer Nodes -->
  <circle cx="32" cy="12" r="5" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
  <circle cx="32" cy="12" r="2" fill="#38BDF8" />

  <circle cx="50" cy="48" r="5" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
  <circle cx="50" cy="48" r="2" fill="#38BDF8" />

  <circle cx="14" cy="48" r="5" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
  <circle cx="14" cy="48" r="2" fill="#38BDF8" />

  <!-- Central Self-Healing Nexus -->
  <circle cx="32" cy="36" r="8" fill="#0A1628" stroke="url(#favNexus)" stroke-width="2" filter="url(#favGlow)" />
  <circle cx="32" cy="36" r="3.5" fill="#10B981" />
  <path d="M 32 31 L 32 41 M 27 36 L 37 36" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
</svg>
